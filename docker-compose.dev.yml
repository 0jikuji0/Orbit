# Base de données pour le développement local : pnpm db:up
# Projet « orbit-dev » : ne se mélange pas avec le docker-compose.yml de production.
name: orbit-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5432:5432"
    volumes:
      - orbit-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orbit-dev-db:
    # Nom historique du volume (avant l'ajout de `name: orbit-dev`) : les données sont conservées.
    name: orbit_orbit-dev-db
